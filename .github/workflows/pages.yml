name: Publish demo and test report

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'tools/test_report.py'
      - 'web/site.py'
      - 'web/browser_test.mjs'
      - 'web/package.json'
      - 'web/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify demo and evidence assets
        run: python3 web/site.py --verify-site site
      # Exercise the exact committed site that will be uploaded, before deployment.
      - name: Install pinned browser test dependencies
        run: |
          npm ci --prefix web --ignore-scripts --no-audit --no-fund
          web/node_modules/.bin/playwright install --with-deps chromium firefox
      - name: Browser acceptance gate
        env:
          BROWSER_ARTIFACTS_DIR: ${{ runner.temp }}/browser-artifacts
        run: node web/browser_test.mjs site
      - name: Save browser traces and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-acceptance
          path: ${{ runner.temp }}/browser-artifacts
          if-no-files-found: ignore
          retention-days: 7
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload static site only
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - name: Deploy demo and report
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
